name: Android Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run lint
        run: ./gradlew lint

      - name: Check selected lint issues
        run: |
          python3 .github/scripts/check_lint.py