name: Sync Google Play Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Sync metadata
    runs-on: ubuntu-latest
    environment: "Google Play"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Google Play credentials
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_KEY" > "$RUNNER_TEMP/google-play-key.json"

      - name: Upload metadata
        run: |
          bundle exec fastlane supply \
            --package_name dev.tulis.readbear \
            --json_key "$RUNNER_TEMP/google-play-key.json" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk \
            --skip_upload_aab
